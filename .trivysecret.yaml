# Trivy secret detection configuration
# Custom rules for detecting secrets in RunJS codebase

rules:
  # API Keys
  - id: runjs-api-key
    description: RunJS API Key
    regex: 'rjs_[A-Za-z0-9]{32}'
    keywords:
      - rjs_
      - api_key
      - apikey
    
  # Environment variables that might contain secrets
  - id: env-secrets
    description: Environment secrets
    regex: '(API_KEY|SECRET|PASSWORD|TOKEN|PRIVATE_KEY)_?\d*\s*=\s*["\']?[A-Za-z0-9+/]{20,}["\']?'
    keywords:
      - API_KEY
      - SECRET
      - PASSWORD
      - TOKEN
      - PRIVATE_KEY

  # Database connection strings
  - id: database-url
    description: Database connection string
    regex: '(mongodb|postgres|mysql|redis)://[^\s]+'
    keywords:
      - mongodb://
      - postgres://
      - mysql://
      - redis://

  # JWT tokens
  - id: jwt-token
    description: JWT Token
    regex: 'eyJ[A-Za-z0-9-_=]+\.[A-Za-z0-9-_=]+\.?[A-Za-z0-9-_.+/=]*'
    keywords:
      - eyJ

allowlist:
  # Allow test/example data
  paths:
    - "**/*.test.ts"
    - "**/*.test.js"
    - "**/examples/**"
    - "**/docs/**"
    - "README.md"
  
  # Allow certain patterns in specific files
  rules:
    - id: runjs-api-key
      paths:
        - "src/app/utils/__tests__/**"  # Test files can have example keys